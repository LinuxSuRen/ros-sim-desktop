name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck docker/entrypoint.sh tests/*.sh
      - name: hadolint
        # Run the binary directly with an explicit --config: the container
        # action does not reliably discover .hadolint.yaml in the workspace.
        run: |
          sudo wget -qO /usr/local/bin/hadolint \
            https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          sudo chmod +x /usr/local/bin/hadolint
          hadolint --config .hadolint.yaml --failure-threshold warning \
            docker/base/Dockerfile docker/rviz/Dockerfile docker/gazebo/Dockerfile

  build:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        variant: [rviz, gazebo]
    steps:
      - uses: actions/checkout@v4
      - name: Build base
        run: docker build -f docker/base/Dockerfile -t ros-sim-desktop:base .
      - name: Build ${{ matrix.variant }}
        run: docker build -f docker/${{ matrix.variant }}/Dockerfile -t ros-sim-desktop:${{ matrix.variant }}-ci .
      - name: Smoke test (amd64)
        run: tests/smoke.sh ros-sim-desktop:${{ matrix.variant }}-ci rviz-vnc
        if: matrix.variant == 'rviz'
      - name: Smoke test gazebo headless
        run: |
          docker run -d --name gz-headless ros-sim-desktop:gazebo-ci headless
          sleep 15
          docker logs gz-headless | grep -F '[sim-entrypoint] headless idle'
          docker rm -f gz-headless
        if: matrix.variant == 'gazebo'
