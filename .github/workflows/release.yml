name: release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']

env:
  GHCR: ghcr.io
  IMAGE: linuxsuren/ros-sim-desktop

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # gazebo is amd64-only: ros-humble-gazebo-ros-pkgs / gazebo-plugins have
        # no arm64 jammy debs in packages.ros.org (verified against the
        # binary-arm64 Packages index); rviz stays multi-arch.
        include:
          - variant: rviz
            platforms: linux/amd64,linux/arm64
            smoke_mode: rviz-vnc
          - variant: gazebo
            platforms: linux/amd64
            smoke_mode: gazebo-vnc
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: GHCR login
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR }}
          username: linuxsuren
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/base/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.GHCR }}/${{ env.IMAGE }}:base
          cache-from: type=gha,scope=base
          cache-to: type=gha,scope=base,mode=max

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR }}/${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=ref,event=branch,prefix=${{ matrix.variant }}-
            type=semver,pattern={{version}},prefix=${{ matrix.variant }}-v
            type=sha,prefix=${{ matrix.variant }}-sha-

      - name: Build and push ${{ matrix.variant }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.variant }}/Dockerfile
          platforms: ${{ matrix.platforms }}
          push: true
          build-args: |
            BASE_IMAGE=${{ env.GHCR }}/${{ env.IMAGE }}:base
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,scope=${{ matrix.variant }},mode=max

      - name: amd64 smoke test
        # metadata-action type=sha produces the SHORT sha tag; match it.
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          tests/smoke.sh ${{ env.GHCR }}/${{ env.IMAGE }}:${{ matrix.variant }}-sha-${SHORT_SHA} ${{ matrix.smoke_mode }}

  mirror:
    # Copy multi-arch manifests to the Aliyun mirror registry (release tags only).
    # Requires repository secrets: ALIYUN_USERNAME, ALIYUN_PASSWORD.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        variant: [rviz, gazebo]
    steps:
      - name: skopeo copy to Aliyun
        run: |
          sudo apt-get update && sudo apt-get install -y skopeo
          skopeo copy --all \
            --dest-creds "${{ secrets.ALIYUN_USERNAME }}:${{ secrets.ALIYUN_PASSWORD }}" \
            "docker://ghcr.io/linuxsuren/ros-sim-desktop:${{ matrix.variant }}-v${GITHUB_REF_NAME#v}" \
            "docker://registry.cn-hangzhou.aliyuncs.com/linuxsuren/ros-sim-desktop:${{ matrix.variant }}-v${GITHUB_REF_NAME#v}"
